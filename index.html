<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Step 4e">
<meta name="theme-color" content="#1f2a44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Dossier Step 4e</title>
<style>
/* ====== RÉGLAGES PROF : modifiez le code ci-dessous dans le script (CODE_PROF) ====== */
:root{
  --ink:#1f2a44; --ink-2:#4a5573; --ink-3:#7c86a2;
  --paper:#f6f4ef; --card:#ffffff; --line:#e3dfd5;
  --accent:#ff5a36; --accent-ink:#ffffff; --accent-soft:#ffe6df;
  --green:#1f9d6b; --green-soft:#dcf4e9;
  --orange:#e8901c; --orange-soft:#fdf0db;
  --red:#d6403a; --red-soft:#fbe1df;
  --blue:#2d6cdf; --blue-soft:#e1ebfc;
  --radius:14px; --shadow:0 1px 2px rgba(31,42,68,.06),0 4px 14px rgba(31,42,68,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}

/* Header */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.top-row{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px;font-size:19px;white-space:nowrap}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.brand small{display:block;font-weight:500;font-size:12px;opacity:.7;letter-spacing:0}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:999px;padding:7px 14px 7px 8px;max-width:46vw}
.who .av{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.icon-btn.on{background:var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:1100px;margin:10px auto 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;color:rgba(255,255,255,.7);padding:10px 14px 12px;font-weight:600;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:#fff;border-bottom-color:var(--accent)}
.prof-banner{display:none;background:var(--accent);color:#fff;text-align:center;font-weight:700;font-size:14px;padding:6px}
body.prof .prof-banner{display:block}

main{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
.section{display:none}
.section.active{display:block}
h2{font-size:26px;margin:4px 0 6px;letter-spacing:-.3px}
h3{font-size:18px;margin:22px 0 10px}
.lead{color:var(--ink-2);margin:0 0 18px;max-width:70ch}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.inp{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;min-height:46px;outline:none}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
textarea.inp{min-height:84px;resize:vertical}
.btn{border:0;border-radius:11px;padding:11px 16px;min-height:46px;font-weight:700;background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.accent{background:var(--accent)}
.btn.danger{background:var(--red)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:9px}
.muted{color:var(--ink-3)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px}
.p-green{background:var(--green-soft);color:var(--green)}
.p-orange{background:var(--orange-soft);color:#a45f00}
.p-red{background:var(--red-soft);color:var(--red)}
.p-blue{background:var(--blue-soft);color:var(--blue)}
.p-gray{background:#eeece6;color:var(--ink-2)}

/* Dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.stat b{display:block;font-size:28px;letter-spacing:-.5px}
.stat span{font-size:13px;color:var(--ink-2)}
.bar{height:8px;border-radius:99px;background:#eeece6;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.objectives li{margin:6px 0}

/* Safety */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.rule{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.rule .ico{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800}
.rule.no .ico{background:var(--red-soft);color:var(--red)}
.rule.yes .ico{background:var(--green-soft);color:var(--green)}
table.t{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;font-size:15px}
table.t th,table.t td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
table.t th{background:#f0ede6;font-size:13px;color:var(--ink-2);font-weight:700}
table.t tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius)}

/* Pas */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar .inp{max-width:280px}
.chipf{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.chipf[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pas-card h4{margin:0 0 6px;font-size:17px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pas-card p{margin:6px 0;font-size:15px}
.pas-card .crit{color:var(--green);font-weight:600;font-size:14px}
.pas-card{display:flex;flex-direction:column}
.pas-card .pas-eval{margin-top:auto;display:flex;width:100%}
.pas-card .pas-eval button{flex:1;min-width:0;padding:8px 2px;font-size:14px}
.pas-card > .pill{align-self:flex-start}
.phrases4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.phrases4 .phrase-card{padding:12px;min-width:0}
.phrases4 .phrase-card h4{font-size:15px;flex-wrap:wrap;gap:4px}
.phrases4 .count{font-size:11px;padding:3px 7px}
.phrases4 .timeline{gap:2px}
.phrases4 .timeline div{height:24px;font-size:10px;border-radius:4px}
.phrases4 .chip{font-size:12px;padding:4px 4px 4px 7px}
.phrases4 .chip button{width:22px;height:22px;flex:none}
.phrases4 .chip{max-width:100%}
.phrases4 .chip .chip-name{width:auto;height:auto;flex:1;min-width:0;text-align:left;line-height:1.25}
.phrases4 .add-row{flex-direction:column}
.phrases4 .add-row .btn{width:100%}
.phrases4 .inp{font-size:14px;padding:8px 9px;min-height:40px}
.phrases4 label.f{font-size:12px}
.phrases4 .video-box .btn{font-size:12px;padding:6px 8px}
.seg.yn{display:flex}
.xchk{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;margin-top:8px;font-weight:600}
.xchk input{width:22px;height:22px;accent-color:var(--accent)}
.icon-btn[hidden]{display:none}
.grp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.grp-card{background:var(--card);border:1px solid rgba(31,42,68,.08);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(31,42,68,.04),0 8px 24px rgba(31,42,68,.05);transition:transform .15s,box-shadow .15s}
.grp-card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(31,42,68,.1)}
.grp-card.cur{border:2px solid var(--accent)}
.grp-top{display:flex;gap:10px;align-items:center}
.grp-top .av{width:42px;height:42px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;flex:none}
.grp-top b{display:block;font-size:17px} .grp-top small{color:var(--ink-3)}
.grp-el{display:flex;flex-wrap:wrap;gap:6px}
.grp-el span{background:#f0ede6;border-radius:8px;padding:4px 8px;font-size:13px}
.grp-el b{color:var(--green)}
.grp-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.grp-stats small{display:block;font-size:11px;color:var(--ink-3);font-weight:700;margin-bottom:3px}
.grp-stats .bb-val{font-size:12px;padding:2px 6px}
.obs-row{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:stretch;padding:8px 0;border-bottom:1px solid var(--line)}
.obs-row:last-of-type{border-bottom:0}
.obs-lab{font-weight:800;font-size:14px;display:flex;align-items:center}
.obs-opts{display:grid;gap:6px}
.obs-opt{border:2px solid transparent;border-radius:10px;padding:8px;font-size:13px;line-height:1.3;color:var(--ink);min-height:48px}
.obs-opt.lv1{background:var(--red-soft)} .obs-opt.lv2{background:var(--orange-soft)} .obs-opt.lv3{background:var(--blue-soft)} .obs-opt.lv4{background:var(--green-soft)}
.obs-opt[aria-pressed=true]{border-color:var(--ink);font-weight:800;box-shadow:0 2px 8px rgba(31,42,68,.18)}
@media (max-width:700px){.obs-row{grid-template-columns:1fr}.obs-opts{grid-template-columns:1fr 1fr!important}}
.ev-card{margin-bottom:14px}
.ev-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}
.ev-head small{display:block;color:var(--ink-3);font-size:13px;margin-top:2px}
.ev-levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ev-lvl{border:2px solid transparent;border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.35;color:var(--ink)}
.ev-lvl-t{font-weight:800;font-size:12.5px}
.ev-lvl.lv1{background:var(--red-soft)} .ev-lvl.lv2{background:var(--orange-soft)} .ev-lvl.lv3{background:var(--blue-soft)} .ev-lvl.lv4{background:var(--green-soft)}
.ev-lvl[aria-pressed=true]{border-color:var(--ink);box-shadow:0 2px 8px rgba(31,42,68,.18)}
.ev-mark{font-weight:800;font-size:12px;color:var(--ink)}
.ev-prof{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.ev-prof-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3);margin-bottom:4px}
.ev-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0}
.ev-row .seg button{min-width:44px}
.seg button[aria-pressed=true].lb1{background:var(--red);color:#fff} .seg button[aria-pressed=true].lb2{background:var(--orange);color:#fff}
.seg button[aria-pressed=true].lb3{background:var(--blue);color:#fff} .seg button[aria-pressed=true].lb4{background:var(--green);color:#fff}
.ev-sum th,.ev-sum td{text-align:center} .ev-sum th:first-child,.ev-sum td:first-child{text-align:left}
.ev-dot{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;font-weight:800;color:#fff}
.ev-dot.lv1{background:var(--red)} .ev-dot.lv2{background:var(--orange)} .ev-dot.lv3{background:var(--blue)} .ev-dot.lv4{background:var(--green)}
@media (max-width:700px){.ev-levels{grid-template-columns:1fr 1fr}}
@media (max-width:440px){.ev-levels{grid-template-columns:1fr}}
.bb-msg{padding:10px 12px;border-radius:10px;font-weight:700;margin-bottom:10px}
.bb-msg.ok{background:var(--green-soft);color:var(--green)}
.bb-msg.no{background:var(--orange-soft);color:#8a5200}
.bb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 24px}
.bb-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:10px}
.bb-val{font-weight:800;font-variant-numeric:tabular-nums;border-radius:999px;padding:2px 10px;background:#f0ede6}
.bb-val.ok{background:var(--green-soft);color:var(--green)}
.bb-val.mid{background:var(--blue-soft);color:var(--blue)}
.bb-val.no{background:#f0ede6;color:var(--ink-3)}
.form-tog{width:100%;margin-top:8px;font-size:13px}
.form-tog[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.seg.yn button{flex:1}
@media (max-width:760px){.phrases4{grid-template-columns:repeat(4,220px);overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}}
@media print{.phrases4{grid-template-columns:repeat(4,minmax(0,1fr))!important;overflow:visible}}
.pas-card .add-crea{margin:8px 0 0;width:100%}
.addto-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.addto{flex-direction:column;gap:2px;padding:8px 4px}
.addto small{font-size:12px;color:var(--ink-3)}
.addto small.ok{color:var(--green)} .addto small.high{color:var(--red)}
.chip .chip-name{width:auto;height:auto;background:none;border-radius:0;color:#fff;font:inherit;font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}
@media (max-width:440px){.addto-grid{grid-template-columns:repeat(2,1fr)}}
.eleve-row{display:grid;grid-template-columns:28px 1fr 1fr auto;gap:8px;align-items:center}
.eleve-n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.pas-card .schema{margin-bottom:12px}

/* Mes pas */
.eval-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.eval-row:last-child{border-bottom:0}
.eval-name{flex:1;min-width:0}
.eval-name b{display:block}
.eval-name small{color:var(--ink-3)}
.seg{display:inline-flex;background:#f0ede6;border-radius:11px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:none;border-radius:9px;padding:8px 11px;font-size:13px;font-weight:700;color:var(--ink-2);min-height:38px}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button[aria-pressed=true].l1{background:var(--orange);color:#fff}
.seg button[aria-pressed=true].l2{background:var(--blue);color:#fff}
.seg button[aria-pressed=true].l3{background:var(--green);color:#fff}
.seg button[aria-pressed=true].na{background:var(--red);color:#fff}
.seg button[aria-pressed=true].ec{background:var(--orange);color:#fff}
.seg button[aria-pressed=true].a{background:var(--blue);color:#fff}
.seg button[aria-pressed=true].d{background:var(--green);color:#fff}
.seg button:disabled{opacity:.55;cursor:not-allowed}
.fam-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#f0ede6;font-weight:800;font-size:14px}
.vid-link{font-size:13px;font-weight:700;text-decoration:none;background:var(--blue-soft);color:var(--blue);padding:8px 12px;border-radius:8px;white-space:nowrap;border:0;display:inline-flex;align-items:center;gap:5px;min-height:36px;position:relative}
.vid-link.off{background:var(--green-soft);color:var(--green)}
.offdot{font-size:10px}
.schema{display:block;width:100%;max-width:300px;height:auto;margin:10px auto 4px}
.schema.big{max-width:460px}
.schema text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2);margin:10px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
.legend i.hatch{background:repeating-linear-gradient(45deg,var(--ink-3) 0 2px,#fff 2px 5px);border:1.5px solid var(--ink-3)}
.phr-btn{border:0;background:var(--blue-soft);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600}
.phr-btn span{background:none;padding:0;font-size:12px}
.phr-btn em{font-style:normal;color:var(--ink-3);font-weight:700;margin-right:4px}
.vid-progress{margin-top:10px}
.vid-progress .bar{height:10px}

/* Blocs */
.levels{display:grid;gap:12px}
.level{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start}
.lvl-badge{width:64px;height:64px;border-radius:16px;background:#eeece6;display:grid;place-items:center;font-weight:900;font-size:22px;color:var(--ink-2)}
.level.done .lvl-badge{background:var(--green);color:#fff}
.level.ready .lvl-badge{background:var(--orange);color:#fff}
.phr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.phr span{background:#f0ede6;border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600}
.phr span em{font-style:normal;color:var(--ink-3);font-weight:700;margin-right:4px}
.lvl-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lvl-actions .inp{width:auto;min-height:40px;padding:6px 10px}
.tog{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;min-height:40px}
.tog[aria-pressed=true]{background:var(--orange);border-color:var(--orange);color:#fff}
.tog.prof[aria-pressed=true]{background:var(--green);border-color:var(--green)}

/* Création */
.subtabs{display:inline-flex;background:#e8e4da;border-radius:12px;padding:4px;margin-bottom:14px}
.subtabs button{border:0;background:none;padding:9px 18px;border-radius:9px;font-weight:700}
.subtabs button[aria-selected=true]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.phrase-card h4{margin:0;display:flex;justify-content:space-between;align-items:center}
.count{font-size:13px;font-weight:800;border-radius:999px;padding:4px 10px}
.count.ok{background:var(--green-soft);color:var(--green)}
.count.low{background:var(--orange-soft);color:#a45f00}
.count.high{background:var(--red-soft);color:var(--red)}
.timeline{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:12px 0 6px}
.timeline div{height:30px;border-radius:6px;background:#f0ede6;font-size:11px;font-weight:800;color:var(--ink-3);display:grid;place-items:center;overflow:hidden;white-space:nowrap;padding:0 2px}
.timeline div.f{color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:6px 6px 6px 10px;font-size:14px;font-weight:700;color:#fff}
.chip button{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:6px;width:26px;height:26px;font-weight:900;line-height:1}
.add-row{display:flex;gap:8px}
.add-row select{flex:1}
.video-box{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.video-box video{width:100%;max-height:260px;border-radius:10px;background:#000}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.proc{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.proc:last-child{border-bottom:0}
.check{width:28px;height:28px;flex:none;border-radius:8px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;color:#fff;font-weight:900}
.check[aria-pressed=true]{background:var(--green);border-color:var(--green)}
.proc .body{flex:1}
.proc .body b{display:block}
.proc .body small{color:var(--ink-2)}
.proc .inp{margin-top:8px;min-height:40px}

/* Séances */
.sess{display:grid;gap:10px}
.sess .card{display:grid;grid-template-columns:52px 1fr;gap:12px}
.sess-n{width:52px;height:52px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}
.sess-fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.range-wrap{display:flex;align-items:center;gap:10px}
.range-wrap input{flex:1;accent-color:var(--accent)}
.range-wrap b{width:34px;text-align:center;font-size:18px}

/* Bilan */
.crit-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.crit-row:last-child{border-bottom:0}
.crit-row .lbl small{display:block;color:var(--ink-3);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.colhead{font-size:12px;font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px;text-align:center}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,26,44,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:18px;max-width:480px;width:100%;padding:20px;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 12px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.prof-list{display:grid;gap:8px;margin:12px 0}
.prof-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:left;width:100%}
.prof-item.cur{border-color:var(--accent);background:var(--accent-soft)}
.prof-item .av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.prof-item span{flex:1}
.prof-item small{display:block;color:var(--ink-3)}
.menu-list{display:grid;gap:8px}
.menu-list .btn{justify-content:flex-start}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:200;transition:transform .25s;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.print-only{display:none}

@media (max-width:600px){
  .brand small{display:none}
  .top-row{gap:8px}
  .brand{font-size:17px}
  .who{max-width:34vw;padding-right:10px}
}
@media (max-width:440px){
  .brand > div:last-child{display:none}
  .who{max-width:none;flex:1;min-width:0}
  .level{grid-template-columns:48px 1fr}
  .lvl-badge{width:48px;height:48px;font-size:18px;border-radius:12px}
  .eval-row{flex-wrap:wrap}
  .eval-row .seg{width:100%}
  .eval-row .seg button{flex:1}
  .crit-row{grid-template-columns:1fr}
  .colhead-row{display:none}
  .sess .card{grid-template-columns:1fr}
  .timeline div{font-size:9px}
}

@media print{

  body{background:#fff;font-size:11pt}

}

  };

    <path d="M72 30 L82 44 L76 44 L76 58 L68 58 L68 44 L62 44 Z" fill="var(--ink-3)"/>

/* ===== Vidéos (IndexedDB, restent sur l'appareil) ===== */
let idb=null;
function openDB(){
  return new Promise(res=>{
    try{
      const r = indexedDB.open("step4e-videos",2);
      r.onupgradeneeded = ()=>{ const d=r.result; if(!d.objectStoreNames.contains("v")) d.createObjectStore("v"); if(!d.objectStoreNames.contains("pas")) d.createObjectStore("pas"); };
      r.onsuccess = ()=>{idb=r.result;res(idb)};
      r.onerror = ()=>res(null);
    }catch(e){res(null)}
  });
}
function vidOp(mode,fn,store="v"){
  return new Promise(res=>{
    if(!idb) return res(null);
    try{ const tx = idb.transaction(store,mode); const st = tx.objectStore(store); const rq = fn(st); rq.onsuccess=()=>res(rq.result??true); rq.onerror=()=>res(null); }

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
async function makeZip(entries){
  const parts=[],central=[];let off=0;const enc=new TextEncoder();
  for(const e of entries){
    const name=enc.encode(e.name), data=new Uint8Array(await e.blob.arrayBuffer()), crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);
    parts.push(lh.buffer,name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,name.length,true);ch.setUint32(42,off,true);
    central.push(ch.buffer,name);
    off+=30+name.length+data.length;
  }
  const csize=central.reduce((a,b)=>a+(b.byteLength??b.length),0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);end.setUint32(12,csize,true);end.setUint32(16,off,true);
  return new Blob([...parts,...central,end.buffer],{type:"application/zip"});
}
async function readZip(file){
  const tailLen=Math.min(file.size,66000), tail=new DataView(await file.slice(file.size-tailLen).arrayBuffer());
  let e=-1; for(let i=tailLen-22;i>=0;i--){ if(tail.getUint32(i,true)===0x06054b50){e=i;break;} }
  if(e<0) throw new Error("zip");
  const count=tail.getUint16(e+10,true), cdSize=tail.getUint32(e+12,true), cdOff=tail.getUint32(e+16,true);
  const cd=new DataView(await file.slice(cdOff,cdOff+cdSize).arrayBuffer()); const dec=new TextDecoder(); const out=[]; let q=0;
  for(let k=0;k<count;k++){
    const method=cd.getUint16(q+10,true), size=cd.getUint32(q+20,true), nl=cd.getUint16(q+28,true), xl=cd.getUint16(q+30,true), cl=cd.getUint16(q+32,true), lo=cd.getUint32(q+42,true);
    const name=dec.decode(new Uint8Array(cd.buffer,q+46,nl)); q+=46+nl+xl+cl;
    const lh=new DataView(await file.slice(lo,lo+30).arrayBuffer()); const start=lo+30+lh.getUint16(26,true)+lh.getUint16(28,true);
    if(method===0) out.push({name,blob:file.slice(start,start+size)});
  }
  return out;
}

  }
  if(el.dataset?.vidin){
    const f=el.files?.[0]; if(!f) return; const k=el.dataset.vidin;
    toast("Enregistrement de la vidéo…");
    const r=await putVid(k,f);
    if(r===null){ toast("La vidéo n'a pas pu être enregistrée (espace insuffisant ?)"); return; }
    if(vidURLs[k]){URL.revokeObjectURL(vidURLs[k]); delete vidURLs[k];}
    hydrateVideos(); toast("Vidéo enregistrée sur cet appareil");
  }
});

/* ================= PROFILS ================= */
function profilesModal(){
  const ids=Object.keys(store.profiles).sort((a,b)=>fullName(store.profiles[a]).localeCompare(fullName(store.profiles[b]),"fr"));
  openModal(`<h3>Groupes sur cet appareil</h3>
    <div class="prof-list">${ids.map(id=>{const q=store.profiles[id]; return `<button class="prof-item ${id===store.current?"cur":""}" data-pick="${id}"><span class="av">${initials(q)}</span><span>${esc(fullName(q))}<small>${esc([q.ident.classe,membres(q).join(", ")].filter(Boolean).join(" · "))}</small></span>${id===store.current?"<b style='color:var(--accent)'>●</b>":""}</button>`}).join("")}</div>
    <div class="row" style="justify-content:space-between">
      ${P()?`<button class="btn ghost" id="delMe" style="color:var(--red)">Supprimer ce groupe</button>`:"<span></span>"}
      <button class="btn accent" id="newP">+ Nouveau groupe</button>
    </div>`);
  $("#modal").querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{ store.current=b.dataset.pick; save(); closeModal(); renderAll(); goTab("dossier"); });
  $("#newP").onclick=()=>newProfileModal(false);
  const d=$("#delMe"); if(d) d.onclick=confirmDelete;
}
function newProfileModal(first=false){
  openModal(`<h3>${first?"Bienvenue dans le dossier step du groupe":"Nouveau groupe"}</h3>
    ${first?`<p class="muted" style="margin-top:0">Ce dossier est collectif : un dossier par groupe. Tout est enregistré sur cet appareil.</p>`:""}
    <div class="grid" style="gap:10px;grid-template-columns:1fr 1fr">
      <div><label class="f">Nom du groupe</label><input class="inp" id="npGroupe" placeholder="ex. Groupe 2" autocomplete="off"></div>
      <div><label class="f">Classe</label><input class="inp" id="npClasse" placeholder="ex. 4ème B" autocomplete="off"></div>
    </div>
    <label class="f" style="margin-top:12px">Les élèves du groupe</label>
    <div class="grid" style="gap:8px" id="npEleves">${[0,1,2,3].map(i=>`<div class="eleve-row"><span class="eleve-n">${i+1}</span><input class="inp" data-np="prenom" placeholder="Prénom" autocomplete="off"><input class="inp" data-np="nom" placeholder="Nom" autocomplete="off"></div>`).join("")}</div>
    <button class="btn ghost sm" id="npAdd" style="margin-top:8px">+ Ajouter un élève</button>
    <p class="muted" style="font-size:14px">Vous avez déjà un fichier de sauvegarde ? <button class="btn ghost sm" id="npImport" style="display:inline-flex">Charger le fichier</button></p>
    <p id="npErr" style="color:var(--red);font-weight:600;display:none;margin:0">Indiquez le nom du groupe ou au moins un élève.</p>
    <div class="row" style="justify-content:space-between">${first?`<button class="btn ghost" id="npProf">Je suis le professeur</button>`:`<button class="btn ghost" data-close>Annuler</button>`}<button class="btn accent" id="npOk">Créer le dossier du groupe</button></div>`);
  const pb=$("#npProf"); if(pb) pb.onclick=()=>askCode(()=>{ profMode=true; document.body.classList.add("prof"); $("#profBtn").classList.add("on"); receiveFiles(); });
  $("#npAdd").onclick=()=>{ const box=$("#npEleves"); const n=box.children.length; if(n>=6) return; box.insertAdjacentHTML("beforeend",`<div class="eleve-row"><span class="eleve-n">${n+1}</span><input class="inp" data-np="prenom" placeholder="Prénom" autocomplete="off"><input class="inp" data-np="nom" placeholder="Nom" autocomplete="off"></div>`); if(n+1>=6) $("#npAdd").remove(); };
  $("#npOk").onclick=()=>{
    const g=$("#npGroupe").value.trim(), cl=$("#npClasse").value.trim();
    const el=[...$("#npEleves").children].map(r=>({prenom:r.querySelector('[data-np=prenom]').value.trim(), nom:r.querySelector('[data-np=nom]').value.trim().toUpperCase()}));
    const filled=el.filter(e=>e.prenom||e.nom);
    if(!g && !filled.length){ $("#npErr").style.display="block"; return; }
    while(filled.length<4) filled.push({prenom:"",nom:""});
    const q=blankProfile(g||"Groupe",cl,filled); store.profiles[q.id]=q; store.current=q.id; save(); closeModal(); renderAll(); goTab("dossier");
  };
  $("#npImport").onclick=importFile;
}
function confirmDelete(){
  const p=P();
  openModal(`<h3>Supprimer le dossier du ${esc(fullName(p))} ?</h3><p>Toutes les réponses et vidéos du groupe sur cet appareil seront effacées. Pensez à l'enregistrer avant si vous voulez le garder.</p>
    <div class="row"><button class="btn ghost" data-close>Annuler</button><button class="btn danger" id="delOk">Supprimer</button></div>`);
  $("#delOk").onclick=async()=>{
    const id=store.current;
    for(const k of ["b3","b4"]){ for(let i=1;i<=4;i++) await delVid(`${id}-${k}-p${i}`); await delVid(`${id}-${k}-complet`); }
    await delVid(`${id}-passage1`); await delVid(`${id}-passage2`); await delVid(`${id}-prepassage1`); await delVid(`${id}-prepassage2`);
    delete store.profiles[id]; store.current=Object.keys(store.profiles)[0]||null; save(); closeModal();
    if(store.current){ renderAll(); goTab("dossier"); } else newProfileModal(true);
  };
}
$("#whoBtn").onclick=profilesModal;
$("#prevG").onclick=()=>{ const ids=sortedGroups(); const i=ids.indexOf(store.current); switchGroup(ids[(i-1+ids.length)%ids.length]); };
$("#nextG").onclick=()=>{ const ids=sortedGroups(); const i=ids.indexOf(store.current); switchGroup(ids[(i+1)%ids.length]); };

/* ================= MENU : EXPORT / IMPORT / IMPRESSION ================= */
$("#menuBtn").onclick=()=>{
  openModal(`<h3>Mon dossier</h3>
    <div class="menu-list">
      <button class="btn ghost" id="mExport">📤 Envoyer le dossier au professeur</button>
      <button class="btn ghost" id="mImport">⬆︎ Charger un fichier</button>
      <button class="btn ghost" id="mPrint">🖨 Imprimer / PDF</button>
    </div>
    <p class="muted" style="font-size:13px;margin-bottom:0">Le dossier s'enregistre automatiquement sur cet appareil. « Envoyer le dossier au professeur » crée un fichier à envoyer par AirDrop, avec les vidéos de l'évaluation si vous les cochez.</p>
    <div class="row"><button class="btn" data-close>Fermer</button></div>`);
  $("#mExport").onclick=exportModal; $("#mImport").onclick=importFile; $("#mPrint").onclick=()=>{ closeModal(); setTimeout(()=>window.print(),200); };
};

let dlRunning=false;
function videosModal(){
  const items=allVideoItems();
  const main=items.filter(x=>x.v), have=items.filter(x=>offlineKeys.has(x.k));
  const missing=main.filter(x=>!offlineKeys.has(x.k));
  openModal(`<h3>Vidéos des pas hors connexion</h3>
    <p style="margin-top:0"><b id="vCount">${have.length}</b> vidéo(s) enregistrée(s) sur cet appareil${main.length?` · ${main.length-missing.length} / ${main.length} vidéos du padlet`:""}.</p>
    <div class="bar"><i id="vBar" style="width:${main.length?(main.length-missing.length)/main.length*100:0}%"></i></div>
    <p class="muted" id="vMsg" style="font-size:14px">Une fois enregistrées, les vidéos se lisent sans connexion, même en classe sans wifi.</p>
    <div class="menu-list">
      <button class="btn accent" id="vDl">⬇︎ Télécharger les vidéos (connexion nécessaire)</button>
      <label class="btn ghost file-btn">📁 Ajouter des vidéos depuis l'appareil<input type="file" accept="video/*" multiple id="vPick"></label>
      ${have.length?`<button class="btn ghost" id="vDel" style="color:var(--red)">Supprimer les vidéos des pas</button>`:""}
    </div>
    ${missing.length?`<details style="margin-top:12px"><summary style="cursor:pointer;font-weight:700">Vidéos manquantes (${missing.length})</summary>
      <p class="muted" style="font-size:13px">Nom de fichier attendu entre parenthèses.</p>
      <ul style="font-size:14px;padding-left:18px">${missing.map(x=>`<li>${esc(x.n)} <span class="muted">(${x.k}${VIDEO_EXT})</span></li>`).join("")}</ul></details>`:""}
    <div class="row"><button class="btn" data-close>Fermer</button></div>`);
  $("#vDl").onclick=downloadAllVideos;
  $("#vPick").onchange=async e=>{
    const files=[...e.target.files]; if(!files.length) return;
    const alias=new Map(); items.forEach(x=>alias.set(x.k,x.k));
    [...REPERTOIRE,...TAB_ALL].forEach(p=>{ const s=slug(p.n); if(!alias.has(s)) alias.set(s,vkey(p.n,p.v)); });
    let ok=0; const unknown=[];
    for(const f of files){
      const k=alias.get(slug(f.name.replace(/\.[^.]+$/,"")));
      if(k){ if(await savePasVideo(k,f)) ok++; } else unknown.push(f.name);
    }
    rerenderVideoLists(); videosModal();
    $("#vMsg").innerHTML = `${ok} vidéo(s) ajoutée(s).` + (unknown.length?` <b style="color:var(--red)">Non reconnue(s) : ${unknown.map(esc).join(", ")}</b> — renommez-les comme dans la liste des vidéos manquantes, ou ajoutez-les une par une depuis l'onglet « Les pas » en mode professeur.`:"");
  };
  const d=$("#vDel"); if(d) d.onclick=()=>{
    openModal(`<h3>Supprimer les vidéos des pas ?</h3><p>Les vidéos des pas seront effacées de cet appareil. Les dossiers des élèves et leurs vidéos de création ne sont pas touchés.</p>
      <div class="row"><button class="btn ghost" data-close>Annuler</button><button class="btn danger" id="vDelOk">Supprimer</button></div>`);
    $("#vDelOk").onclick=async()=>{ await clearPasVids(); offlineKeys.clear(); closeModal(); rerenderVideoLists(); toast("Vidéos des pas supprimées"); };
  };
}
async function downloadAllVideos(){
  if(dlRunning) return;
  if(location.protocol==="file:"){ $("#vMsg").textContent="Le téléchargement marche quand l'appli est ouverte depuis son adresse en ligne (GitHub Pages). Sinon, utilisez « Ajouter des vidéos depuis l'appareil »."; return; }
  if(!navigator.onLine){ $("#vMsg").textContent="Pas de connexion : connectez l'appareil au wifi puis recommencez."; return; }
  dlRunning=true; $("#vDl").disabled=true;
  try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  const items=allVideoItems(); let done=0, ok=0, mb=0; const fail=[];
  for(const x of items){
    done++;
    $("#vMsg").textContent=`Téléchargement ${done} / ${items.length} : ${x.n}…`;
    $("#vBar").style.width=(done/items.length*100)+"%";
    if(offlineKeys.has(x.k)){ ok++; continue; }
    try{
      const r=await fetch(VIDEO_DIR+x.k+VIDEO_EXT,{cache:"no-store"});
      if(!r.ok) throw 0;
      const b=await r.blob(); if(!b.size || /text\/html/.test(b.type)) throw 0;
      if(await savePasVideo(x.k,b)){ ok++; mb+=b.size/1048576; } else { fail.push(x.n); break; }
    }catch(e){ if(x.v) fail.push(x.n); }
  }
  dlRunning=false; rerenderVideoLists(); videosModal();
  $("#vMsg").innerHTML=`Terminé : ${offlineKeys.size} vidéo(s) disponibles hors connexion${mb>=1?` (${Math.round(mb)} Mo téléchargés)`:""}.`+(fail.length?` <b style="color:var(--red)">Introuvables sur le site : ${fail.map(esc).join(", ")}.</b>`:"");
}
async function exportModal(){
  const p=P(), ks=await groupVideoKeys(p.id), ev=ks.filter(k=>/-passage[12]$/.test(k)), autres=ks.filter(k=>!/-passage[12]$/.test(k));
  openModal(`<h3>Envoyer le dossier au professeur</h3>
    <p class="muted" style="margin-top:0">Un seul fichier est créé. Envoyez-le par AirDrop au professeur (ou par mail / OneDrive).</p>
    <label class="xchk"><input type="checkbox" checked disabled> Le dossier du groupe</label>
    <label class="xchk"><input type="checkbox" id="xEv" ${ev.length?"checked":"disabled"}> Vidéos de l'évaluation ${ev.length?`(${ev.length})`:"<span class='muted'>(aucune filmée)</span>"}</label>
    <label class="xchk"><input type="checkbox" id="xAu" ${autres.length?"":"disabled"}> Autres vidéos : pré-évaluation, création ${autres.length?`(${autres.length})`:"<span class='muted'>(aucune)</span>"}</label>
    <p id="xMsg" class="muted" style="font-size:14px"></p>
    <div class="row"><button class="btn ghost" data-close>Annuler</button><button class="btn accent" id="xGo">📤 Envoyer</button></div>`);
  $("#xGo").onclick=async()=>{
    const keys=[...($("#xEv").checked?ev:[]),...($("#xAu").checked?autres:[])];
    $("#xGo").disabled=true; $("#xMsg").textContent=keys.length?"Préparation du fichier avec les vidéos…":"Préparation…";
    try{ await exportFile(keys); }catch(e){ $("#xMsg").textContent="Le fichier n'a pas pu être créé (vidéos trop lourdes ?). Réessayez sans les autres vidéos."; $("#xGo").disabled=false; }
  };
}
async function exportFile(vkeys){
  vkeys=Array.isArray(vkeys)?vkeys:[];
  if(vkeys.length){
    const p=P(); const entries=[{name:"dossier.json",blob:new Blob([JSON.stringify({app:"step4e",version:1,exported:new Date().toISOString(),profile:p})],{type:"application/json"})}];
    for(const k of vkeys){ const b=await getVid(k); if(b) entries.push({name:`videos/${k}.${vidExt(b)}`,blob:b}); }
    const zip=await makeZip(entries); const name=`dossier-step_${slug(p.ident.classe||"classe")}_${slug(fullName(p))}.zip`;
    try{ const file=new File([zip],name,{type:"application/zip"}); if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); closeModal(); return; } }catch(err){ if(err&&err.name==="AbortError"){ closeModal(); return; } }
    const a=document.createElement("a"); a.href=URL.createObjectURL(zip); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
    closeModal(); toast("Fichier enregistré"); return;
  }
  const p=P(); const data=JSON.stringify({app:"step4e",version:1,exported:new Date().toISOString(),profile:p},null,2);
  const name=`dossier-step_${slug(p.ident.classe||"classe")}_${slug(fullName(p))}.json`;
  const blob=new Blob([data],{type:"application/json"});
  try{
    const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); closeModal(); return; }
  }catch(err){ if(err && err.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  closeModal(); toast("Fichier enregistré");
}
function importFile(){
  const i=document.createElement("input"); i.type="file"; i.accept=".json,application/json";
  i.onchange=async()=>{
    const f=i.files[0]; if(!f) return;
    try{
      const d=JSON.parse(await f.text()); const q=d.profile;
      if(d.app!=="step4e"||!q||!q.ident) throw 0;
      const base=blankProfile(); const merged=Object.assign(base,q); merged.creation=Object.assign(blankProfile().creation,q.creation||{});
      if(!merged.id) merged.id=uid();
      store.profiles[merged.id]=merged; store.current=merged.id; save(); closeModal(); renderAll(); goTab("dossier");
      toast(`Dossier de ${fullName(merged)} chargé`);
    }catch(e){ toast("Ce fichier n'est pas un dossier step valide."); }
  };
  i.click();
}

/* ================= DÉMARRAGE ================= */
(async function init(){
  load(); await openDB(); await refreshOfflineKeys();
  if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} }
  try{ const t=sessionStorage.getItem("step4e-tab"); if(t && TABS.some(x=>x[0]===t)) curTab=t; }catch(e){}
  renderTabs();
  if(!store.current || !store.profiles[store.current]){
    store.current = Object.keys(store.profiles)[0]||null;
  }
  if(store.current){ renderAll(); goTab(curTab); }
  else newProfileModal(true);
})();
</script>
